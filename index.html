<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1WorldCrafts ERP v2</title>
<!-- Firebase SDK (compat version via CDN) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCq_ah_zt0Z9kR71asGVYxkU0ko8-Pt3TU",
    authDomain: "worldcrafts-erp.firebaseapp.com",
    projectId: "worldcrafts-erp",
    storageBucket: "worldcrafts-erp.firebasestorage.app",
    messagingSenderId: "637734683759",
    appId: "1:637734683759:web:96f7f291382c300d8d399a"
  };

  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    console.log('Firebase initialized successfully');
    const db = firebase.firestore();

    window.fbSaveEOD = async function(data) {
      try {
        const cu = window.CU || 'unknown';
        const userName = (window.USERS && window.USERS[cu]) ? window.USERS[cu].name : cu;
        await db.collection('eod_reports').add({
          ...data,
          user: cu,
          userName: userName,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          date: new Date().toISOString().split('T')[0]
        });
        return true;
      } catch(e) { console.error('EOD save failed', e); return false; }
    };

    window.fbSaveSiteUpdate = async function(siteId, updateText, health) {
      try {
        const cu = window.CU || 'unknown';
        const userName = (window.USERS && window.USERS[cu]) ? window.USERS[cu].name : cu;
        await db.collection('site_updates').add({
          siteId, updateText, health,
          user: cu,
          userName: userName,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          date: new Date().toISOString().split('T')[0]
        });
        return true;
      } catch(e) { console.error('Site update failed', e); return false; }
    };

    window.fbSaveDelegatedTask = async function(task) {
      try {
        await db.collection('delegated_tasks').doc(task.id).set({
          ...task,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        return true;
      } catch(e) { console.error('Delegated task failed', e); return false; }
    };

    window.fbSaveCashEntry = async function(entry) {
      try {
        const cu = window.CU || 'unknown';
        await db.collection('cash_entries').add({
          ...entry,
          user: cu,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          date: new Date().toISOString().split('T')[0]
        });
        return true;
      } catch(e) { console.error('Cash entry failed', e); return false; }
    };

    window.fbLoadEODs = async function() {
      try {
        const snap = await db.collection('eod_reports').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e) { console.error('EOD load failed', e); return []; }
    };

    window.fbUpdateEOD = async function(docId, data) {
      try {
        await db.collection('eod_reports').doc(docId).update({
          ...data,
          editedAt: firebase.firestore.FieldValue.serverTimestamp(),
          editedBy: window.CU || 'unknown'
        });
        return true;
      } catch(e) { console.error('EOD update failed', e); return false; }
    };

    window.fbLoadMyEODs = async function(userKey) {
      try {
        // Use where only (no orderBy) to avoid needing a composite Firestore index
        const snap = await db.collection('eod_reports')
          .where('user','==',userKey)
          .limit(50)
          .get();
        // Sort client-side by date desc
        const docs = snap.docs.map(d=>({id:d.id,...d.data()}));
        docs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
        return docs;
      } catch(e) {
        console.error('My EOD load failed', e);
        // Fallback: load all and filter
        try {
          const snap2 = await db.collection('eod_reports').get();
          const all = snap2.docs.map(d=>({id:d.id,...d.data()}));
          const filtered = all.filter(r=>r.user===userKey);
          filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
          return filtered;
        } catch(e2) { return []; }
      }
    };

    window.fbLoadSiteUpdates = async function() {
      try {
        const snap = await db.collection('site_updates').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e) { console.error('Site updates load failed', e); return []; }
    };

    window.fbSaveAttendance = async function(data) {
      try {
        await db.collection('attendance').add({...data,savedBy:window.CU||'unknown',timestamp:firebase.firestore.FieldValue.serverTimestamp(),date:new Date().toISOString().split('T')[0]});
        return true;
      } catch(e){console.error('Attendance save failed',e);return false;}
    };

    // ── Attendance Employees stored in Firestore per site ──
    window.fbSaveAttEmployees = async function(siteCode, employees) {
      try {
        await db.collection('att_employees').doc(siteCode).set({
          siteCode, employees,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: window.CU || 'unknown'
        });
        return true;
      } catch(e) { console.error('Att employees save failed', e); return false; }
    };

    window.fbLoadAttEmployees = async function(siteCode) {
      try {
        const doc = await db.collection('att_employees').doc(siteCode).get();
        if (doc.exists) return doc.data().employees || [];
        return null; // null = not in cloud yet
      } catch(e) { console.error('Att employees load failed', e); return null; }
    };

    // ── Attendance Data (daily marks) stored in Firestore per site+month ──
    window.fbSaveAttData = async function(siteCode, monthStr, data) {
      try {
        const docId = siteCode + '_' + monthStr;
        await db.collection('att_data').doc(docId).set({
          siteCode, monthStr, data,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedBy: window.CU || 'unknown'
        });
        return true;
      } catch(e) { console.error('Att data save failed', e); return false; }
    };

    window.fbLoadAttData = async function(siteCode, monthStr) {
      try {
        const docId = siteCode + '_' + monthStr;
        const doc = await db.collection('att_data').doc(docId).get();
        if (doc.exists) return doc.data().data || {};
        return null;
      } catch(e) { console.error('Att data load failed', e); return null; }
    };
    window.fbSavePR = async function(data) {
      try {
        const cu=window.CU||'unknown';
        await db.collection('purchase_requests').add({...data,requestedBy:cu,requesterName:(window.USERS&&window.USERS[cu])?window.USERS[cu].name:cu,status:'Pending',timestamp:firebase.firestore.FieldValue.serverTimestamp(),date:new Date().toISOString().split('T')[0]});
        return true;
      } catch(e){console.error('PR save failed',e);return false;}
    };
    window.fbSaveEnquiry = async function(data) {
      try {
        const id='ENQ-'+Date.now();
        await db.collection('sales_enquiries').doc(id).set({...data,id,addedBy:window.CU||'unknown',status:'Enquiry',timestamp:firebase.firestore.FieldValue.serverTimestamp(),date:new Date().toISOString().split('T')[0]});
        return true;
      } catch(e){console.error('Enquiry save failed',e);return false;}
    };
    window.fbSaveStageUpdate = async function(quoteId,stage,notes) {
      try {
        const cu=window.CU||'unknown';
        await db.collection('sales_updates').add({quoteId,stage,notes,updatedBy:cu,updaterName:(window.USERS&&window.USERS[cu])?window.USERS[cu].name:cu,timestamp:firebase.firestore.FieldValue.serverTimestamp(),date:new Date().toISOString().split('T')[0]});
        return true;
      } catch(e){console.error('Stage update failed',e);return false;}
    };
    window.fbSaveQuotation = async function(data) {
      try {
        await db.collection('quotations').doc(data.quoteNo).set({...data,createdBy:window.CU||'unknown',timestamp:firebase.firestore.FieldValue.serverTimestamp()});
        return true;
      } catch(e){console.error('Quotation save failed',e);return false;}
    };
    window.fbLoadPRs = async function() {
      try {
        const snap=await db.collection('purchase_requests').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e){console.error('PR load failed',e);return[];}
    };
    window.fbLoadCashEntries = async function() {
      try {
        const snap=await db.collection('cash_entries').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e){console.error('Cash load failed',e);return[];}
    };
    window.fbLoadDelegatedTasks = async function() {
      try {
        const snap=await db.collection('delegated_tasks').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e){console.error('Delegated tasks load failed',e);return[];}
    };
    window.fbSaveRABill = async function(data) {
      try {
        const cu=window.CU||'unknown';
        await db.collection('ra_bills').doc(data.billNo).set({...data,createdBy:cu,creatorName:(window.USERS&&window.USERS[cu])?window.USERS[cu].name:cu,timestamp:firebase.firestore.FieldValue.serverTimestamp()});
        return true;
      } catch(e){console.error('RA Bill save failed',e);return false;}
    };
    window.fbLoadSalesPipeline = async function() {
      try {
        const snap=await db.collection('sales_enquiries').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e){console.error('Sales pipeline load failed',e);return[];}
    };
    window.fbLoadEnquiries = async function() {
      try {
        const snap=await db.collection('sales_enquiries').orderBy('timestamp','desc').get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e){console.error('Enquiries load failed',e);return[];}
    };
    window.fbSaveEnquiryNotification = async function(enqData) {
      // Save a notification for owner/purchase/planning
      try {
        const notifyUsers=['prayas','kuldeep','priyanshu','amit'];
        const batch=db.batch();
        notifyUsers.forEach(uid=>{
          const ref=db.collection('notifications').doc();
          batch.set(ref,{toUser:uid,type:'new_enquiry',enqId:enqData.id||'',client:enqData.client||'',project:enqData.project||'',addedBy:window.CU||'unknown',addedByName:(window.USERS&&window.USERS[window.CU||''])?window.USERS[window.CU||''].name:window.CU,timestamp:firebase.firestore.FieldValue.serverTimestamp(),read:false,date:new Date().toISOString().split('T')[0]});
        });
        await batch.commit();
        return true;
      } catch(e){console.error('Notification save failed',e);return false;}
    };
    window.fbLoadMyNotifications = async function(userId) {
      try {
        const snap=await db.collection('notifications').where('toUser','==',userId).where('read','==',false).orderBy('timestamp','desc').limit(20).get();
        return snap.docs.map(d=>({id:d.id,...d.data()}));
      } catch(e){console.error('Notification load failed',e);return[];}
    };
    window.fbMarkNotificationsRead = async function(ids) {
      try {
        const batch=db.batch();
        ids.forEach(id=>batch.update(db.collection('notifications').doc(id),{read:true}));
        await batch.commit();
      } catch(e){console.error('Mark read failed',e);}
    };
    console.log('🔥 Firebase connected — worldcrafts-erp');
  } catch(e) {
    console.error('Firebase init failed', e);
  }
</script>
<style>
:root{--navy:#0d1b2a;--navy2:#1a2e45;--navy3:#243b55;--orange:#f47c20;--orange2:#e06910;--gold:#ffc857;--green:#2ecc71;--red:#e74c3c;--blue:#3498db;--purple:#9b59b6;--text:#e8edf2;--text2:#a0b0c0;--card:#1e3248;--border:#2d4a6a;--sidebar-w:240px}

body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--navy);color:var(--text);min-height:100vh}

.logo-area{text-align:center;margin-bottom:32px}.logo-icon{font-size:48px;display:block;margin-bottom:8px}

.form-group{margin-bottom:20px}.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-group select,.form-group input{width:100%;padding:12px 14px;background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border .2s}
.form-group select:focus,.form-group input:focus{border-color:var(--orange)}.form-group select option{background:var(--navy2)}
.btn-login{width:100%;padding:14px;background:var(--orange);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;margin-top:8px}
.btn-login:hover{background:var(--orange2)}.login-note{text-align:center;font-size:11px;color:var(--text2);margin-top:16px}
#app{display:none}.app-wrapper{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--navy2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s}

.sidebar-role{font-size:11px;color:var(--text2);margin-top:2px}.sidebar-user{font-size:14px;font-weight:600;margin-top:6px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{padding:8px 16px 4px;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:700}

.nav-item:hover{background:var(--navy3);color:var(--text)}.nav-item.active{background:var(--navy3);color:var(--orange);border-left-color:var(--orange)}
.nav-item .icon{width:18px;text-align:center;font-size:16px}
.sidebar-bottom{padding:12px 16px;border-top:1px solid var(--border)}
.btn-logout{width:100%;padding:9px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text2);font-size:12px;cursor:pointer;transition:all .2s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}
.main-content{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column}
.topbar{background:var(--navy2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:17px;font-weight:700}.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-date{font-size:12px;color:var(--text2)}
.badge{background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.hamburger{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer}
.page-content{padding:24px;flex:1;overflow-y:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:20px}
.card-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.stat-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:28px;font-weight:700;margin:6px 0 2px}.stat-sub{font-size:11px;color:var(--text2)}
.orange{color:var(--orange)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.gold{color:var(--gold)}.purple{color:var(--purple)}

.task-priority{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:700}

.eod-form textarea,.eod-form input,.eod-form select{width:100%;padding:10px 12px;background:var(--navy2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;resize:vertical;transition:border .2s;font-family:inherit}

.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.team-member{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.member-info h4{font-size:14px;font-weight:700}.member-info span{font-size:11px;color:var(--text2)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:auto}

.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--border);flex-wrap:wrap}

.tab.active{color:var(--orange);border-bottom-color:var(--orange);font-weight:600}
.tab-panel{display:none}.tab-panel.active{display:block}

.modal-header h3{font-size:16px;font-weight:700;margin:0}.modal-close{background:none;border:none;color:var(--text2);font-size:26px;cursor:pointer;line-height:1;padding:0 4px}

.progress-bar{background:var(--navy2);border-radius:99px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:var(--orange);transition:width .3s}
.upload-zone{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:border .2s;color:var(--text2)}
.upload-zone:hover{border-color:var(--orange);color:var(--text)}.upload-zone input[type=file]{display:none}
.upload-icon{font-size:32px;margin-bottom:8px}.uploaded-files{margin-top:12px}
.file-chip{display:inline-flex;align-items:center;gap:6px;background:var(--navy2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;margin:4px}
.file-chip .remove{cursor:pointer;color:var(--text2)}.file-chip .remove:hover{color:var(--red)}
.hin-label{color:var(--gold);font-style:italic}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.tag-blue{background:rgba(52,152,219,.2);color:var(--blue)}.tag-green{background:rgba(46,204,113,.2);color:var(--green)}
.tag-red{background:rgba(231,76,60,.2);color:var(--red)}.tag-orange{background:rgba(244,124,32,.2);color:var(--orange)}
.tag-gold{background:rgba(255,200,87,.2);color:var(--gold)}.tag-purple{background:rgba(155,89,182,.2);color:var(--purple)}
.ai-box{background:linear-gradient(135deg,rgba(52,152,219,.1),rgba(155,89,182,.1));border:1px solid rgba(52,152,219,.3);border-radius:10px;padding:14px;margin-bottom:14px}
.ai-box-title{font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.ai-box p{font-size:13px;color:var(--text2);line-height:1.7}
.info-box{background:rgba(52,152,219,.08);border:1px solid rgba(52,152,219,.25);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--text2);margin-bottom:14px}
.warn-box{background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.25);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--text2);margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:12px}
th{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--navy2)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-content{margin-left:0}.hamburger{display:block}.stat-grid{grid-template-columns:1fr 1fr}.page-content{padding:16px}.row2,.row3{grid-template-columns:1fr}.tabs{gap:2px}.tab{padding:8px 12px;font-size:12px}}
</style>
</head>

window.ATT_EMPLOYEES=[];
// In-memory cache: {siteCode: [emp,...]}
window._empCache={};

function getAttEmployees(siteCode){
  if(!siteCode)return[];
  // Return from memory cache if available
  if(window._empCache[siteCode])return window._empCache[siteCode];
  // Fall back to localStorage cache while cloud loads
  try{const s=localStorage.getItem('1wc_att_emp_'+siteCode);if(s){const arr=JSON.parse(s);window._empCache[siteCode]=arr;return arr;}}catch(e){}
  return[];
}
async function loadAttEmployeesCloud(siteCode){
  if(!siteCode)return[];
  if(!window.fbLoadAttEmployees)return getAttEmployees(siteCode);
  const cloudEmps=await window.fbLoadAttEmployees(siteCode);
  if(cloudEmps!==null){
    window._empCache[siteCode]=cloudEmps;
    try{localStorage.setItem('1wc_att_emp_'+siteCode,JSON.stringify(cloudEmps));}catch(e){}
    return cloudEmps;
  }
  return getAttEmployees(siteCode);
}
function saveAttEmployees(siteCode,arr){
  if(!siteCode)return;
  window._empCache[siteCode]=arr;
  try{localStorage.setItem('1wc_att_emp_'+siteCode,JSON.stringify(arr));}catch(e){}

// Improvement 4: handleFiles — real file preview
function handleFiles(input,containerId){
  const c2=document.getElementById(containerId)||document.getElementById('eod-uploaded');
  if(!c2)return;
  Array.from(input.files).forEach(f=>{
    const id='f_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
    const isImg=f.type.startsWith('image/');
    const sizeStr=f.size>1048576?(f.size/1048576).toFixed(1)+'MB':(f.size/1024).toFixed(0)+'KB';
    const reader=new FileReader();
    reader.onload=function(e){
      const dataUrl=e.target.result;
      window.UPLOADED_FILES.push({id,name:f.name,type:f.type,size:f.size,dataUrl});
      window.PHOTO_UPLOADS.push({id,name:f.name,type:f.type,size:f.size,dataUrl});
      const div=document.createElement('div');
      div.id='prev_'+id;
      div.style.cssText='display:inline-block;margin:4px;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--navy2);position:relative;vertical-align:top';
      if(isImg){
        div.innerHTML=`<img src="${dataUrl}" style="width:60px;height:60px;object-fit:cover;border-radius:4px;display:block"><div style="font-size:10px;color:var(--text2);margin-top:3px;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${f.name}</div><div style="font-size:10px;color:var(--text2)">${sizeStr}</div><span onclick="removeUploadedFile('${id}')" style="position:absolute;top:2px;right:4px;cursor:pointer;color:var(--red);font-size:14px;font-weight:700">×</span>`;
      } else {
        const icon=f.type==='application/pdf'?'📄':f.name.endsWith('.xlsx')||f.name.endsWith('.xls')?'📊':'📎';
        div.innerHTML=`<div style="font-size:28px;text-align:center">${icon}</div><div style="font-size:10px;color:var(--text2);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</div><div style="font-size:10px;color:var(--text2)">${sizeStr}</div><span onclick="removeUploadedFile('${id}')" style="position:absolute;top:2px;right:4px;cursor:pointer;color:var(--red);font-size:14px;font-weight:700">×</span>`;
      }
      c2.appendChild(div);
      // Update counter
      const cnt=document.getElementById('file-count-'+containerId);
      if(cnt)cnt.textContent='✓ '+window.UPLOADED_FILES.length+' files attached';
    };
    reader.readAsDataURL(f);
  });
}
function removeUploadedFile(id){
  window.UPLOADED_FILES=window.UPLOADED_FILES.filter(f=>f.id!==id);
  window.PHOTO_UPLOADS=window.PHOTO_UPLOADS.filter(f=>f.id!==id);
  const el=document.getElementById('prev_'+id);
  if(el)el.remove();
}

// Improvement 5: downloadAsPDF
function downloadAsPDF(content,filename){
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${filename}</title>
  <style>
    body{font-family:Arial,sans-serif;padding:24px;color:#000;max-width:900px;margin:0 auto}
    table{width:100%;border-collapse:collapse;margin-bottom:16px}
    th,td{border:1px solid #bbb;padding:8px 10px;font-size:12px;text-align:left}
    th{background:#1a1a2e;color:#fff}
    h1,h2{color:#1a1a2e}
    .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;border-bottom:3px solid #f47c20;padding-bottom:12px}
    .company{font-size:22px;font-weight:900;color:#1a1a2e}
    .tag-line{font-size:11px;color:#666}
    .no-print{margin-top:24px;display:flex;gap:12px}
    @media print{.no-print{display:none}body{padding:10px}}
    input,select,textarea{border:none;background:transparent;font-size:12px;color:#000;width:100%;font-family:Arial,sans-serif}
  </style></head>
  <body>
  <div class="header">
    <div><div class="company">1WorldCrafts</div><div class="tag-line">Engineering Reliable Environments · Faridabad</div></div>
    <div style="text-align:right;font-size:11px;color:#666">${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</div>
  </div>
  ${content}
  <div class="no-print">
    <button onclick="window.print()" style="padding:10px 28px;background:#f47c20;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:700">🖨️ Print / Save as PDF</button>
    <button onclick="window.close()" style="padding:10px 20px;background:#eee;color:#333;border:none;border-radius:6px;font-size:14px;cursor:pointer">Close</button>
  </div>
  </body></html>`;
  // Use blob URL — works without popup permission
  const blob=new Blob([html],{type:'text/html'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.target='_blank';
  a.rel='noopener';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  showToast('PDF opened in new tab — click Print / Save as PDF','success');
}

// Improvement 6: SheetJS helpers
function exportToExcel(data,filename,sheetName){
  if(typeof XLSX==='undefined'){showToast('Excel library loading... try again in a moment','info');return;}
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,sheetName||'Sheet1');
  XLSX.writeFile(wb,filename+'.xlsx');
}
function importFromExcel(file,callback){
  if(typeof XLSX==='undefined'){showToast('Excel library not loaded','info');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    const data=new Uint8Array(e.target.result);
    const wb=XLSX.read(data,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const json=XLSX.utils.sheet_to_json(ws);
    callback(json);
  };
  reader.readAsArrayBuffer(file);
}

function doLogin(){
  const sel=document.getElementById('user-select').value;
  if(!sel){showToast('⚠️ Please select your profile','info');return;}
  CU=sel; window.CU=sel;
  taskChecked=loadTaskChecked(); // restore today's SOP progress
  taskReasons=loadTaskReasons(); // restore incomplete reasons
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  initApp();
}
function doLogout(){
  CU=null; window.CU=null; taskChecked={}; taskReasons={};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('user-select').value='';
  document.getElementById('pin-input').value='';
}
function initApp(){
  const u=USERS[CU];
  document.getElementById('sb-name').textContent=u.name;
  document.getElementById('sb-role').textContent=u.role;
  document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  buildSidebar();
  // show alert badge for owner
  const ab=document.getElementById('alert-badge');
  if(CU==='prayas'){ab.style.display='flex';}else{ab.style.display='none';}
  // Load delegated tasks and notifications from Firebase then show dashboard
  window.ENQUIRY_NOTIFICATIONS=[];
  async function loadAndShow(){
    // 1. Load delegated tasks
    if(window.fbLoadDelegatedTasks){
      try{
        const cloudTasks=await window.fbLoadDelegatedTasks();
        if(cloudTasks&&cloudTasks.length>0){
          cloudTasks.forEach(ct=>{
            const idx=DELEGATED_TASKS.findIndex(t=>t.id===ct.id);
            if(idx>=0){DELEGATED_TASKS[idx]=ct;}else{DELEGATED_TASKS.push(ct);}
          });
        }
      }catch(e){}
    }
    // 2. Load notifications for owner/purchase/planning
    const notifyRoles=['prayas','kuldeep','priyanshu','amit'];
    if(notifyRoles.includes(CU)&&window.fbLoadMyNotifications){
      try{
        const notifs=await window.fbLoadMyNotifications(CU);
        window.ENQUIRY_NOTIFICATIONS=notifs||[];
        const alertBadge=document.getElementById('alert-badge');
        if(alertBadge&&notifs.length>0){
          alertBadge.style.display='flex';
          const ac=document.getElementById('alert-count');
          if(ac) ac.textContent=notifs.length;
        }
      }catch(e){}
    }
    // 3. Update task badge
    const myDelegated=DELEGATED_TASKS.filter(t=>t.to===CU&&!t.done);
    const tb=document.getElementById('task-badge');
    if(myDelegated.length>0){tb.style.display='flex';document.getElementById('task-count').textContent=myDelegated.length;}else{tb.style.display='none';}
    showPage('dashboard');
  }
  loadAndShow().catch(()=>{
    const myDelegated=DELEGATED_TASKS.filter(t=>t.to===CU&&!t.done);
    const tb=document.getElementById('task-badge');
    if(myDelegated.length>0){tb.style.display='flex';document.getElementById('task-count').textContent=myDelegated.length;}else{tb.style.display='none';}
    showPage('dashboard');
  });
}

function showPage(id){

  if(navEl)navEl.classList.add('active');

  window.c=document.getElementById('page-content');
  sidebarOpen=false;
  document.getElementById('sidebar').classList.remove('open');
  const titles={dashboard:'Dashboard',tasks:USERS[CU]?.hinglish?'Aaj Ka Kaam':'My Tasks (SOP)',eod:'EOD Report','my-eod':'📋 My EOD Reports','team-eod':'👥 Team EOD — All Members',sites:'Site Updates',sales:'Sales Pipeline',accounts:'Accounts',purchase:'Purchase','team-status':'Team Overview',alerts:'Alerts & Reports','eod-owner':'📋 EOD Reports — Full Team',delegate:'Delegate Tasks','vendor-compare':'Vendor Comparison',rfq:'RFQ Generator','project-costing':'Project Costing','ai-feedback':'AI Suggestions & Feedback',execution:'Execution Timeline',attendance:'Attendance','ra-billing':'RA Billing',quotation:'Quotation Generator',planning:'Planning','project-manager':'🏗️ Project / Site Manager'};
  document.getElementById('page-title').textContent=titles[id]||id;
  const content=document.getElementById('page-content');
  // Clear first so pages using c.innerHTML directly render fresh
  content.innerHTML='';
  switch(id){
    case 'dashboard': content.innerHTML=pageDashboard();break;
    case 'tasks': content.innerHTML=pageTasks();break;
    case 'eod': content.innerHTML=pageEOD();break;
    case 'sites': content.innerHTML=pageSites();break;

    case 'delegate': pageDelegate();break;

    case 'rfq': pageRFQ();break;
    case 'project-costing': pageProjectCosting();break;
    case 'ai-feedback': pageAIFeedback();break;
    case 'execution': pageExecution();break;
    case 'attendance': pageAttendance();break;
    case 'project-manager': pageProjectManager();break;
    case 'ra-billing': pageRABilling();break;
    case 'quotation': pageQuotation();break;

  }

async function submitDelegateTask(){
  const to=document.getElementById('del-to').value;
  const task=document.getElementById('del-task').value.trim();
  const pri=document.getElementById('del-pri').value;
  const due=document.getElementById('del-due').value;
  if(!task){showToast('⚠️ Enter task description','error');return;}
  if(!to){showToast('⚠️ Select person to assign','error');return;}
  const newTask={id:'dt'+Date.now(),from:'prayas',to,task,priority:pri,date:due,done:false};
  DELEGATED_TASKS.unshift(newTask);
  showToast('⏳ Saving to cloud...','info');
  if(window.fbSaveDelegatedTask){
    const ok=await window.fbSaveDelegatedTask(newTask);
    if(ok){showToast('✅ Task assigned to '+USERS[to]?.name+' & saved to cloud','success');}
    else{showToast('✅ Task assigned to '+USERS[to]?.name+' (local only)','success');}
  } else {
    showToast('✅ Task assigned to '+USERS[to]?.name,'success');
  }

  if(typeof renderDelegateList==='function') renderDelegateList();
}

async function markDelegatedDone(id){

function eodIncompleteReason(taskKey, taskText){

  openModal('Task Incomplete – Reason',`
  <div style="font-size:13px;color:var(--text2);margin-bottom:8px">Why could this task not be completed today?</div>
  <div style="font-size:12px;font-weight:600;padding:8px 10px;background:var(--navy3);border-radius:6px;margin-bottom:14px;color:var(--text)">${escHtml(taskText||taskKey)}</div>

    <label style="display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--navy2);border-radius:8px;cursor:pointer;border:1px solid var(--border)" onclick="document.getElementById('inc-custom-wrap').style.display=${i===3?'\'block\'':'\'none\''};this.querySelector('input').checked=true">
      <input type="radio" name="inc-reason" value="${i}" style="margin-top:2px" ${i===0?'checked':''}>

  <div class="btn-row" style="margin-top:16px">
    <button class="btn-primary" onclick="submitIncompleteReason('${taskKey}','${(taskText||taskKey).replace(/'/g,"\\'")}')">Submit Reason</button>
    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
  </div>`);
}
function submitIncompleteReason(taskKey, taskText){
  const sel=document.querySelector('input[name="inc-reason"]:checked');
  if(!sel){showToast('Select a reason','error');return;}
  const reasonLabels=['Didn\'t get time – will do tomorrow','No response from other end – will follow up tomorrow','Delegated to someone – awaiting their response','Others'];
  const idx=+sel.value;
  const customText=idx===3?(document.getElementById('inc-custom-text')?.value||'').trim():'';
  if(idx===3&&!customText){showToast('Please describe the reason','error');return;}
  const reason=reasonLabels[idx];
  taskReasons[taskKey]={reason, customText, taskText: taskText||taskKey};
  saveTaskReasons();
  // Also update delegated task record if it's a delegated task
  if(taskKey.startsWith('del-')){
    const id=taskKey.slice(4);
    const t=DELEGATED_TASKS.find(x=>x.id===id);
    if(t){t.incompReason=reason+(customText?' – '+customText:'');if(window.fbSaveDelegatedTask)window.fbSaveDelegatedTask(t);}
  }
  showToast('📝 Reason recorded – will appear in EOD','info');
  closeModal();
  showPage('tasks');
}

async function submitEOD(){
  const summary=document.getElementById('eod-summary')?.value||'';
  const tomorrow=document.getElementById('eod-tomorrow')?.value||'';
  const issues=document.getElementById('eod-issues')?.value||'';
  const mood=document.querySelector('input[name="eod-mood"]:checked')?.value||'';
  const escalation=document.getElementById('eod-owner')?.value||'';
  const site=document.getElementById('eod-site')?.value||'';
  const date=document.getElementById('eod-date')?.value||new Date().toISOString().split('T')[0];
  if(!summary){showToast('⚠️ Please fill today\'s work summary','info');return;}
  // Build task summary for the report
  const sop=SOPs[CU]||[];
  const myDelegated=DELEGATED_TASKS.filter(t=>t.to===CU&&!t.done);
  const completedList=[];
  sop.forEach((t,i)=>{if(taskChecked[i])completedList.push({text:t.text,source:'sop'});});
  myDelegated.forEach(t=>{if(t.done)completedList.push({text:t.task,source:'delegated'});});
  const incompleteList=[];
  Object.entries(taskReasons).forEach(([k,r])=>{incompleteList.push({key:k,text:r.taskText||k,reason:r.reason,customText:r.customText||''});});
  const taskSummary={completed:completedList,incomplete:incompleteList};
  const data={summary,tomorrow,issues,mood,escalation,site,date,taskSummary};
  showToast('⏳ Submitting EOD...','info');
  if(window.fbSaveEOD){
    const ok=await window.fbSaveEOD(data);
    if(ok){showToast('✅ EOD saved to cloud! Owner & Amit notified.','success');}
    else{showToast('⚠️ EOD saved locally (cloud sync failed)','info');}
  } else {
    showToast('✅ EOD submitted!','success');
  }
  setTimeout(()=>showPage('dashboard'),1500);
}

  if(!id||!client){showToast('Fill Quote No. and Client','info');return;}

async function submitEntry(){
  const sel=document.getElementById('proj-code-sel');
  if(!sel||!sel.value){showToast('⚠️ Please select a Project Code!','info');return;}
  const entryType=document.querySelector('#acc-entry select')?.value||'';
  const amount=document.querySelector('#acc-entry input[type=number]')?.value||'';
  const party=document.querySelectorAll('#acc-entry input[type=text], #acc-entry input:not([type])')[0]?.value||'';
  const desc=document.querySelector('#acc-entry textarea')?.value||'';
  const date=document.querySelector('#acc-entry input[type=date]')?.value||new Date().toISOString().split('T')[0];
  const category=document.getElementById('acc-entry-category')?.value||'';
  showToast('⏳ Saving...','info');
  const ok=window.fbSaveCashEntry?await window.fbSaveCashEntry({type:'financial',entryType,project:sel.value,amount:+amount,paidTo:party,desc,date,category}):false;
  if(ok){showToast('✅ Entry saved to cloud. Project: '+sel.value,'success');}
  else{showToast('✅ Entry saved (local). Project: '+sel.value,'success');}
}

function renderLedger(){
  const wrap=document.getElementById('ledger-table-wrap');
  if(!wrap)return;
  const receipts=window.LEDGER_ENTRIES.filter(e=>e.amount>0).reduce((a,b)=>a+b.amount,0);
  const payments=window.LEDGER_ENTRIES.filter(e=>e.amount<0).reduce((a,b)=>a+Math.abs(b.amount),0);
  const net=receipts-payments;
  const r=document.getElementById('ldg-receipts');const p=document.getElementById('ldg-payments');const n=document.getElementById('ldg-net');
  if(r)r.textContent='₹'+(receipts/100000).toFixed(1)+'L';
  if(p)p.textContent='₹'+(payments/100000).toFixed(1)+'L';
  if(n)n.textContent=(net>=0?'+':'')+'₹'+(net/100000).toFixed(1)+'L';
  wrap.innerHTML=`<table><thead><tr><th>Date</th><th>Description</th><th>Project</th><th>Type</th><th>Amount (₹)</th><th>Party</th><th>Action</th></tr></thead>
  <tbody>${window.LEDGER_ENTRIES.map(t=>`<tr>
    <td style="color:var(--text2);white-space:nowrap">${t.date}</td>
    <td>${t.desc}</td>
    <td><span class="tag tag-orange" style="font-size:10px">${t.project||'—'}</span></td>
    <td><span class="tag tag-blue" style="font-size:10px">${t.type}</span></td>
    <td style="font-weight:700;color:${t.amount>=0?'var(--green)':'var(--red)'};text-align:right">${t.amount>=0?'+':''}₹${Math.abs(t.amount).toLocaleString('en-IN')}</td>
    <td style="color:var(--text2)">${t.party||'—'}</td>
    <td>
      <button class="btn-secondary btn-xs" onclick="openEditTransaction('${t.id}')">✏️</button>
      <button class="btn-secondary btn-xs" style="color:var(--red)" onclick="deleteTransaction('${t.id}')">🗑️</button>
    </td>
  </tr>`).join('')}</tbody></table>`;
}
function openAddTransaction(existing){
  const t=existing||{};
  openModal(existing?'Edit Transaction':'Add Transaction',`<div class="eod-form">
    <div class="row2">
      <div class="form-row"><label>Date</label><input id="lt-date" type="date" value="${t.date||new Date().toISOString().split('T')[0]}"/></div>
      <div class="form-row"><label>Type</label>
        <select id="lt-type">${['Receipt','Payment','Expense','Invoice','Salary','Contractor Payment'].map(s=>`<option${s===t.type?' selected':''}>${s}</option>`).join('')}</select>
      </div>
    </div>
    <div class="form-row"><label>Description</label><input id="lt-desc" value="${t.desc||''}" placeholder="Transaction description"/></div>
    <div class="row2">
      <div class="form-row"><label>Project Code</label><select id="lt-project">${getProjectCodeOptions()}</select></div>
      <div class="form-row"><label>Amount (₹) — positive=receipt, negative=payment</label><input id="lt-amount" type="number" value="${t.amount||0}"/></div>
    </div>
    <div class="form-row"><label>Party (Vendor/Client)</label><input id="lt-party" value="${t.party||''}"/></div>
    <div class="btn-row"><button class="btn-primary" onclick="saveTransaction('${t.id||''}')">Save</button></div>
  </div>`);
  // set project select value
  setTimeout(()=>{const s=document.getElementById('lt-project');if(s&&t.project){const opt=Array.from(s.options).find(o=>o.value===t.project);if(opt)opt.selected=true;}},50);
}
function saveTransaction(existingId){
  const date=document.getElementById('lt-date')?.value;
  const type=document.getElementById('lt-type')?.value;
  const desc=document.getElementById('lt-desc')?.value.trim();
  const project=document.getElementById('lt-project')?.value;
  const amount=parseFloat(document.getElementById('lt-amount')?.value)||0;
  const party=document.getElementById('lt-party')?.value.trim();
  if(!desc){showToast('Enter description','info');return;}
  if(existingId){
    const idx=window.LEDGER_ENTRIES.findIndex(e=>e.id===existingId);
    if(idx>=0)window.LEDGER_ENTRIES[idx]={id:existingId,date,desc,project,type,amount,party};
  } else {
    window.LEDGER_ENTRIES.push({id:'L'+Date.now(),date,desc,project,type,amount,party});
  }
  saveLedger();closeModal();renderLedger();showToast('Transaction saved','success');
}
function openEditTransaction(id){const t=window.LEDGER_ENTRIES.find(e=>e.id===id);if(t)openAddTransaction(t);}
function deleteTransaction(id){
  if(!confirm('Delete this entry?'))return;
  window.LEDGER_ENTRIES=window.LEDGER_ENTRIES.filter(e=>e.id!==id);
  saveLedger();renderLedger();showToast('Deleted','info');
}
function exportLedger(){
  exportToExcel(window.LEDGER_ENTRIES.map(e=>({Date:e.date,Description:e.desc,Project:e.project,Type:e.type,Amount:e.amount,Party:e.party})),'1WC_Ledger','Ledger');
}

function ptCalcHealth(item){
  // item = task or subtask: totalQty, dailyLogs, startDate, durationDays
  const done=ptDoneQty(item);
  const total=parseFloat(item.totalQty)||0;
  if(total===0) return {pct:0,status:'Not Started',dot:'⚪',color:'var(--text2)',ratio:0,done:0,total:0,expectedEnd:null};
  const pct=Math.min(100,Math.round((done/total)*100));
  const today=new Date(); today.setHours(0,0,0,0);
  const start=item.startDate?new Date(item.startDate):null;
  if(start) start.setHours(0,0,0,0);
  const dur=parseInt(item.durationDays)||0;
  const expectedEnd=start&&dur?new Date(start.getTime()+dur*86400000):null;

  // ── Completed ──────────────────────────────────────────────
  if(pct>=100) return{pct:100,status:'Completed ✅',dot:'🟢',color:'var(--green)',ratio:null,done,total,expectedEnd};

  // ── Not yet started ────────────────────────────────────────
  if(done===0 && (!start || today<start)){
    return{pct:0,status:'Not Started',dot:'⚪',color:'var(--text2)',ratio:0,done,total,expectedEnd};
  }

  // ── Pace-ratio health (core logic) ─────────────────────────
  // Required avg qty per day = totalQty / totalDays
  // Days elapsed so far (from startDate to today, capped at duration)
  let ratio=null;
  let dotColor='var(--text2)';
  let dot='⚪';
  let status='Not Started';
  if(start&&dur){
    const totalDays=dur;
    const reqPerDay=total/totalDays;               // required daily rate
    // Elapsed days: from start to today (min 1 so day-0 doesn't divide by zero)
    const msElapsed=Math.max(today-start,0);
    const daysElapsed=Math.max(1,Math.min(Math.floor(msElapsed/86400000)+1,totalDays));
    // Cumulative expected qty by today = reqPerDay × daysElapsed
    const expectedByToday=reqPerDay*daysElapsed;
    // Actual pace ratio = achieved so far / what should have been done by today
    ratio=expectedByToday>0?done/expectedByToday:0;
    if(ratio>1){
      status='Very Healthy 🌟'; dot='🟢'; dotColor='#1a7a2e'; // dark green
    } else if(ratio===1){
      status='Healthy'; dot='🟢'; dotColor='var(--green)';
    } else if(ratio>=0.8){
      status='OK ⚡'; dot='🟡'; dotColor='var(--gold)';
    } else {
      status='Unhealthy – Needs Attention 🚨'; dot='🔴'; dotColor='var(--red)';
    }
  } else {
    // No start/duration set — just show progress
    if(done>0){status='Ongoing';dot='🔵';dotColor='var(--blue)';}
  }
  return{pct,status,dot,color:dotColor,ratio:ratio!==null?Math.round(ratio*100)/100:null,done,total,expectedEnd};
}
function ptDoneQty(item){
  return((item.dailyLogs||[]).reduce((s,l)=>s+(parseFloat(l.qty)||0),0));
}
function ptActualEnd(item){
  const h=ptCalcHealth(item);
  if(h.pct>=100){
    const logs=item.dailyLogs||[];
    if(logs.length){
      const sorted=[...logs].sort((a,b)=>b.date.localeCompare(a.date));
      return sorted[0].date;
    }
  }
  return null;
}
function ptOverallSiteHealth(siteCode){
  const tasks=(window.PT_DATA[siteCode]||{tasks:[]}).tasks;
  if(!tasks.length)return{pct:0,status:'No tasks',dot:'⚪',color:'var(--text2)'};
  let totalPct=0, ratioSum=0, ratioCount=0, allDone=true;
  tasks.forEach(t=>{
    const items=t.subtasks&&t.subtasks.length?t.subtasks:[t];
    items.forEach(item=>{
      const h=ptCalcHealth(item);
      totalPct+=h.pct;
      if(h.status!=='Completed ✅')allDone=false;
      if(h.ratio!==null){ratioSum+=h.ratio;ratioCount++;}
    });
  });
  const itemCount=tasks.reduce((s,t)=>s+((t.subtasks&&t.subtasks.length)?t.subtasks.length:1),0);
  const avgPct=itemCount?Math.round(totalPct/itemCount):0;
  if(allDone)return{pct:100,status:'All Completed ✅',dot:'🟢',color:'var(--green)'};
  if(!ratioCount)return{pct:avgPct,status:'Not Started',dot:'⚪',color:'var(--text2)'};
  const avgRatio=ratioSum/ratioCount;
  if(avgRatio>1) return{pct:avgPct,status:'Very Healthy 🌟',dot:'🟢',color:'#1a7a2e'};
  if(avgRatio>=0.99)return{pct:avgPct,status:'Healthy',dot:'🟢',color:'var(--green)'};
  if(avgRatio>=0.8) return{pct:avgPct,status:'OK ⚡',dot:'🟡',color:'var(--gold)'};
  return{pct:avgPct,status:'Unhealthy – Needs Attention 🚨',dot:'🔴',color:'var(--red)'};
}

function ptOverallSubHealth(items){
  let ratioSum=0,ratioCount=0,allDone=true;
  items.forEach(i=>{
    const h=ptCalcHealth(i);

    if(h.ratio!==null){ratioSum+=h.ratio;ratioCount++;}
  });
  if(allDone)return{status:'Completed ✅',dot:'🟢',color:'var(--green)'};
  if(!ratioCount)return{status:'Not Started',dot:'⚪',color:'var(--text2)'};
  const avg=ratioSum/ratioCount;
  if(avg>1) return{status:'Very Healthy 🌟',dot:'🟢',color:'#1a7a2e'};
  if(avg>=0.99)return{status:'Healthy',dot:'🟢',color:'var(--green)'};
  if(avg>=0.8) return{status:'OK ⚡',dot:'🟡',color:'var(--gold)'};
  return{status:'Unhealthy – Needs Attention 🚨',dot:'🔴',color:'var(--red)'};
}
function ptExpectedEnd(startDate,durationDays){
  if(!startDate||!durationDays)return '-';
  const d=new Date(startDate);

}

// ── EXCEL EXPORT ──────────────────────────────────────────
function ptExportExcel(){
  const siteCode=window.PT_SITE;
  const tasks=(window.PT_DATA[siteCode]||{tasks:[]}).tasks;
  if(!tasks.length){showToast('No tasks to export','info');return;}
  const rows=[['Task','Subtask','Unit','Total Qty','Done Qty','% Done','Start Date','Duration(days)','Expected End','Actual End','Status','Last Note']];
  tasks.forEach(task=>{
    const hasSubs=task.subtasks&&task.subtasks.length>0;
    const items=hasSubs?task.subtasks.map(s=>({...s,_taskTitle:task.title})):[{...task,_taskTitle:''}];
    items.forEach(item=>{
      const h=ptCalcHealth(item);
      const expEnd=ptExpectedEnd(item.startDate,item.durationDays);
      const actEnd=ptActualEnd(item)||'';
      const lastLog=[...(item.dailyLogs||[])].sort((a,b)=>b.date.localeCompare(a.date))[0];
      rows.push([
        hasSubs?item._taskTitle:task.title,
        hasSubs?item.title:'',
        item.unit||'',
        item.totalQty||0,
        h.done,
        h.pct+'%',
        item.startDate||'',
        item.durationDays||'',
        expEnd,
        actEnd,
        h.status,
        lastLog?lastLog.note:''
      ]);
    });
  });
  try{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:25},{wch:25},{wch:8},{wch:10},{wch:10},{wch:8},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14},{wch:30}];
    XLSX.utils.book_append_sheet(wb,ws,'Timeline_'+siteCode);
    XLSX.writeFile(wb,'1WC_Timeline_'+siteCode+'_'+new Date().toISOString().split('T')[0]+'.xlsx');
    showToast('✅ Excel downloaded','success');
  }catch(e){showToast('Excel export failed: '+e.message,'error');}
}

function getCell(eAtt,d){

  if(!raw)return{s:'',ot:0};

// ── Wage calculation per worker type ──────────────────────────────
// workerType: 'labour' | 'employee'
// LABOUR:   monthly÷26 per day. P=paid. A=no pay. W/WO=unpaid off. Sunday auto=WO unpaid.
// LABOUR: monthly÷26 per day. P=paid. A=no pay. W/WO=paid (weekly off). H=paid. Sundays=NOT auto-paid.
// EMPLOYEE: monthly÷daysInMonth per day. P=paid. A=no pay. W/WO=paid. H=paid. Sundays=paid only when marked WO. P on Sunday = carry-forward paid leave.
// For both: OT = (dailyRate÷8) × OT_hours  (only on days where status is P or H+work)
function calcWages(emp, attData, monthStr){
  const numDays=getDaysInMonth(monthStr);
  const [yr,mo]=monthStr.split('-').map(Number);
  const wt=emp.workerType||'labour';
  const wage=parseFloat(emp.wage)||0;
  const dailyRate=wt==='labour'?(wage/26):(wage/numDays);
  let totalPay=0, pCount=0, aCount=0, wCount=0, otTotal=0, sundayCarryLeave=0;
  for(let d=1;d<=numDays;d++){
    const cell=getCell(attData,d);
    const dow=new Date(yr,mo-1,d).getDay(); // 0=Sun
    const isSunday=dow===0;
    let status=cell.s;
    const ot=parseFloat(cell.ot)||0;
    otTotal+=ot;
    if(status==='P'){
      pCount++;
      totalPay+=dailyRate+(dailyRate/8)*ot;
      // Employee working on Sunday earns carry-forward paid leave (not extra pay)
      if(isSunday && wt==='employee') sundayCarryLeave++;
    } else if(status==='A'){
      aCount++;
    } else if(status==='W'||status==='WO'){
      wCount++;
      // WO: paid for both labour and employee (explicitly marked weekly-off)
      totalPay+=dailyRate;
    } else if(status==='H'){
      // Holiday — paid; OT if they worked
      totalPay+=dailyRate+(dailyRate/8)*ot;
    }
    // status==='' (blank) = not yet marked → no pay, no count
  }
  return{totalPay,pCount,aCount,wCount,otTotal,dailyRate,sundayCarryLeave};
}

function attStatusChange(sel){
  const empId=sel.dataset.emp;
  const day=parseInt(sel.dataset.day);
  const val=sel.value;
  const data=loadAttData();
  if(!data[empId])data[empId]={};
  const prev=getCell(data[empId],day);
  data[empId][day]={s:val,ot:prev.ot||0};
  saveAttData(data);
  // Also persist to Firebase
  const _sSite=document.getElementById('att-site')?.value||'';
  const _sMon=document.getElementById('att-month')?.value||new Date().toISOString().substr(0,7);
  if(window.fbSaveAttData)window.fbSaveAttData(_sSite,_sMon,data);
  const scMap={P:'var(--green)',A:'var(--red)',W:'#888',WO:'#888',H:'var(--blue)'};
  sel.style.background=(val?(scMap[val]||'var(--bg2)')+'22':'var(--bg2)');
  sel.style.color=val?(scMap[val]||'var(--text)'):'var(--text2)';
  _updateAttRow(empId);
  updateAttWagesSummary();
}
function attOTChange(inp){
  const empId=inp.dataset.emp;
  const day=parseInt(inp.dataset.day);
  const ot=parseFloat(inp.value)||0;
  const data=loadAttData();
  if(!data[empId])data[empId]={};
  const prev=getCell(data[empId],day);
  data[empId][day]={s:prev.s||'',ot:ot};
  saveAttData(data);
  // Also persist to Firebase
  const _oSite=document.getElementById('att-site')?.value||'';
  const _oMon=document.getElementById('att-month')?.value||new Date().toISOString().substr(0,7);
  if(window.fbSaveAttData)window.fbSaveAttData(_oSite,_oMon,data);
  inp.style.color=ot>0?'var(--orange)':'var(--text2)';
  _updateAttRow(empId);
  updateAttWagesSummary();
}
function _updateAttRow(empId){
  const row=document.querySelector('tr[data-emp-row="'+empId+'"]');
  if(!row)return;
  const monthStr=document.getElementById('att-month')?.value||new Date().toISOString().substr(0,7);
  const data=loadAttData();
  const eAtt=data[empId]||{};
  const emp=window.ATT_EMPLOYEES.find(e=>e.id===empId);
  if(!emp)return;
  const {totalPay,pCount,aCount,otTotal}=calcWages(emp,eAtt,monthStr);
  const pTd=row.querySelector('td.att-p');
  const aTd=row.querySelector('td.att-a');
  const otTd=row.querySelector('td.att-ot');
  const wTd=row.querySelector('td.att-wages');
  if(pTd)pTd.textContent=pCount;
  if(aTd)aTd.textContent=aCount;
  if(otTd)otTd.textContent=otTotal||0;
  if(wTd)wTd.textContent='₹'+Math.round(totalPay).toLocaleString('en-IN');
  updateAttWagesSummary();
}
function updateAttWagesSummary(){
  const monthStr=document.getElementById('att-month')?.value||new Date().toISOString().substr(0,7);
  const site=document.getElementById('att-site')?.value||'';
  const data=loadAttData();
  let total=0;
  window.ATT_EMPLOYEES.forEach(e=>{
    const {totalPay}=calcWages(e,data[e.id]||{},monthStr);
    total+=totalPay;
  });
  const s=document.getElementById('att-wages-summary');
  if(s)s.innerHTML='<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">'
    +'<div style="font-weight:700;font-size:15px">💰 Total Net Payable: <span style="color:var(--gold)">₹'+Math.round(total).toLocaleString('en-IN')+'</span></div>'
    +'<div style="font-size:12px;color:var(--text2)">Month: '+monthStr+' | Site: '+site+'</div></div>';
}

function saveGlobalSite(){
  const code=document.getElementById('gs-code')?.value.trim().toUpperCase().replace(/\s+/g,'-');
  const name=document.getElementById('gs-name')?.value.trim();
  const status=document.getElementById('gs-status')?.value||'active';
  if(!code||!name){showToast('Fill code and name','info');return;}
  if(!window.SITES)window.SITES=[];
  if(window.SITES.find(s=>s.code===code)){showToast('Site code already exists','info');return;}
  window.SITES.push({code,name,status});
  try{localStorage.setItem('1wc_sites',JSON.stringify(window.SITES));}catch(e){}
  // also sync to ATT_SITES
  if(!window.ATT_SITES)window.ATT_SITES=[];
  if(!window.ATT_SITES.find(s=>s.code===code))window.ATT_SITES.push({code,name});
  saveATTSites();
  closeModal();
  pageProjectManager();
  showToast('✅ Project '+name+' added','success');
}
function toggleSiteStatus(code){
  if(!window.SITES)return;
  const s=window.SITES.find(s=>s.code===code);
  if(s)s.status=s.status==='active'?'inactive':'active';
  try{localStorage.setItem('1wc_sites',JSON.stringify(window.SITES));}catch(e){}
  pageProjectManager();
  showToast('Site status updated','info');
}
function deleteGlobalSite(code){
  if(!confirm('Delete site '+code+'? This will not delete attendance data.'))return;
  window.SITES=(window.SITES||[]).filter(s=>s.code!==code);
  window.ATT_SITES=(window.ATT_SITES||[]).filter(s=>s.code!==code);
  try{localStorage.setItem('1wc_sites',JSON.stringify(window.SITES));}catch(e){}
  saveATTSites();
  pageProjectManager();
  showToast('Site removed','info');
}

function switchTab(el,groupClass,targetId){
  document.querySelectorAll('.'+groupClass).forEach(t=>t.style.display='none');
  document.getElementById(targetId).style.display='block';
  el.closest('.tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
function showToast(msg,type='success'){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;z-index:9999;max-width:300px;box-shadow:0 4px 20px rgba(0,0,0,0.3);transition:all 0.3s';document.body.appendChild(t);}
  t.textContent=msg;
  t.style.background=type==='success'?'#38a169':type==='error'?'#e53e3e':'#3182ce';
  t.style.color='#fff';t.style.display='block';t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.style.display='none',300);},3000);
}
function openModal(title,body){
  const m=document.getElementById('modal-overlay');
  if(!m){console.error('modal-overlay not found');return;}
  const t=document.getElementById('modal-title');

  if(t)t.innerHTML=title;
  if(b)b.innerHTML=body;
  m.style.display='flex';
  m.classList.add('open');
  // focus first input after a tick
  setTimeout(()=>{const inp=b&&b.querySelector('input,select,textarea');if(inp)inp.focus();},100);
}
function closeModal(){
  const m=document.getElementById('modal-overlay');
  if(m){m.style.display='none';m.classList.remove('open');}
}
function generateQuoteNo(){
  const d=new Date();
  const yy=String(d.getFullYear()).slice(2);
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const serial=Math.floor(Math.random()*900)+100;
  const initials=USERS[CU]?.initials||'CR';
  return `CRA-${yy}${mm}-${initials}-${serial}`;
}

async function saveSiteUpdate(siteId){
  const modal=document.getElementById('modal-overlay')||document.getElementById('modal');
  const selects=modal?modal.querySelectorAll('select'):[];
  const textareas=modal?modal.querySelectorAll('textarea'):[];
  const inputs=modal?modal.querySelectorAll('input[type=number]'):[];
  const health=selects[0]?.value||'green';

  const manpower=inputs[0]?.value||'';
  if(!progress){showToast('⚠️ Please fill today\'s progress','info');return;}
  // Update local health
  const site=SITES.find(s=>s.id===siteId);
  if(site) site.health=health;

async function saveContractorPayment(name,site){

async function generateRABill(){
  const site=document.getElementById('ra-site')?.value||'';
  const billNo=document.getElementById('ra-bill-no')?.value||('RA-'+Date.now());
  const from=document.getElementById('ra-from')?.value||'';
  const to=document.getElementById('ra-to')?.value||'';
  const mirRef=document.getElementById('ra-mir-ref')?.value||'';
  const labour=parseFloat(document.getElementById('ra-labour')?.value)||0;
  const contractor=parseFloat(document.getElementById('ra-contractor')?.value)||0;
  const retPct=parseFloat(document.getElementById('ra-retention')?.value)||10;
  const gstPct=parseFloat(document.getElementById('ra-gst')?.value)||18;
  if(!site||!from||!to){showToast('⚠️ Fill site and period dates','error');return;}
  const gross=labour+contractor;
  const retention=gross*(retPct/100);
  const net=gross-retention;
  const gst=net*(gstPct/100);
  const total=net+gst;
  const data={billNo,site,periodFrom:from,periodTo:to,mirRef,labourComponent:labour,contractorComponent:contractor,gross,retentionPct:retPct,retention,netAmount:net,gstPct,gstAmount:gst,totalPayable:total,status:'Generated',generatedDate:new Date().toISOString().split('T')[0]};
  showToast('⏳ Saving RA Bill...','info');
  const ok=window.fbSaveRABill?await window.fbSaveRABill(data):false;
  if(ok){showToast(`✅ RA Bill ${billNo} saved to cloud! Total: ₹${(total/100000).toFixed(2)}L`,'success');}
  else{showToast(`✅ RA Bill ${billNo} generated — Gross:₹${(gross/1000).toFixed(0)}K | Net:₹${(net/1000).toFixed(0)}K | Total:₹${(total/1000).toFixed(0)}K`,'success');}
}

}

async function saveAttendance(){
  const rows=document.querySelectorAll('#attendance-body tr');

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function startEODEdit(id){
  window._myEODEdit=id;
  _renderMyEODs();
  // Scroll to the editing card
  setTimeout(()=>{const el=document.getElementById('eod-card-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},100);
}

function cancelEODEdit(){
  window._myEODEdit=null;
  _renderMyEODs();
}

async function saveEODEdit(id){
  const summary=(document.getElementById('edit-summary-'+id)?.value||'').trim();
  const issues=(document.getElementById('edit-issues-'+id)?.value||'').trim();
  const tomorrow=(document.getElementById('edit-tomorrow-'+id)?.value||'').trim();
  const escalation=(document.getElementById('edit-escalation-'+id)?.value||'').trim();
  if(!summary){showToast('⚠️ Work summary cannot be empty','info');return;}
  if(!window.fbUpdateEOD){showToast('⚠️ Firebase not connected','info');return;}
  showToast('⏳ Saving...','info');
  const ok=await window.fbUpdateEOD(id,{summary,issues,tomorrow,escalation});
  if(ok){
    // Update local cache
    const r=window._myEODs&&window._myEODs.find(x=>x.id===id);
    if(r){r.summary=summary;r.issues=issues;r.tomorrow=tomorrow;r.escalation=escalation;r.editedAt=true;}
    window._myEODEdit=null;
    _renderMyEODs();
    showToast('✅ EOD report updated!','success');
  } else {
    showToast('❌ Update failed. Check connection.','info');
  }
}

      +byDate[date].map(r=>{
        const mood=r.mood||'';
        const initials=(r.userName||r.user||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
        const userColor=USERS[r.user]?.color||'var(--orange)';
        const siteTag=r.site?'<span style="font-size:10px;background:var(--navy3);padding:2px 7px;border-radius:8px;color:var(--text2)">📍 '+r.site+'</span>':'';
        const isMe=r.user===CU;
        return '<div class="card" style="margin-bottom:10px;padding:16px">'
          +'<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">'
          +'<div style="width:38px;height:38px;border-radius:50%;background:'+userColor+';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0">'+initials+'</div>'
          +'<div style="flex:1">'
          +'<div style="font-weight:700;font-size:15px">'+escHtml(r.userName||r.user||'—')+(isMe?' <span style="font-size:10px;background:var(--orange)22;color:var(--orange);border-radius:8px;padding:1px 6px">You</span>':'')+'</div>'
          +'<div style="font-size:11px;color:var(--text2);margin-top:2px">'+escHtml(USERS[r.user]?.role||'')+' '+siteTag+(r.editedAt?' · ✏️ edited':'')+'</div>'
          +'</div>'
          +'<div style="text-align:right">'
          +'<div style="font-size:13px;font-weight:600;color:'+moodColor[mood]+'">'+moodEmoji[mood]+'</div>'
          +(isMe?'<button class="btn-secondary btn-sm" style="margin-top:4px;font-size:10px" onclick="showPage(\'my-eod\')">✏️ Edit</button>':'')
          +'</div></div>'
          +'<div style="display:grid;gap:8px">'
          +'<div style="background:var(--navy2);border-radius:8px;padding:10px">'
          +'<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:4px">✅ Work Done</div>'
          +'<div style="font-size:13px;line-height:1.5">'+escHtml(r.summary||'—')+'</div></div>'
          +(r.tomorrow?'<div style="background:var(--navy2);border-radius:8px;padding:10px">'
            +'<div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:4px">📅 Tomorrow</div>'
            +'<div style="font-size:13px;line-height:1.5">'+escHtml(r.tomorrow)+'</div></div>':'')
          +(r.issues?'<div style="background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:10px">'
            +'<div style="font-size:10px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:4px">⚠️ Issues</div>'
            +'<div style="font-size:13px;line-height:1.5;color:var(--red)">'+escHtml(r.issues)+'</div></div>':'')
          +'</div></div>';
      }).join('')
      +'</div>';
  }).join('');
}

// ===================== BADGE UPDATES =====================
function updateBadges(){
  const alertBadge=document.getElementById('alert-badge');
  const taskBadge=document.getElementById('task-badge');
  if(alertBadge){
    const count=DELEGATED_TASKS.filter(t=>t.incompReason).length+4;
    document.getElementById('alert-count').textContent=count;alertBadge.style.display=count>0?'flex':'none';
  }
  if(taskBadge){
    const count=DELEGATED_TASKS.filter(t=>t.to===CU&&!t.done).length;
    document.getElementById('task-count').textContent=count;taskBadge.style.display=count>0?'flex':'none';
  }
}
function openSubmitIdeaModal(){
  openModal('Submit SOP Idea',`
  <div class="eod-form">
    <div class="form-row"><label>Your Idea / Suggestion</label><textarea id="idea-text" rows="4" placeholder="How can we improve a process, tool, or workflow?"></textarea></div>
    <div class="form-row"><label>Category</label>
      <select id="idea-cat"><option>Process Improvement</option><option>Safety</option><option>Cost Saving</option><option>Tools / Equipment</option><option>Communication</option><option>Other</option></select>
    </div>
    <div class="btn-row"><button class="btn-primary" onclick="submitIdea()">📤 Submit Idea</button></div>
  </div>`);
}
function submitIdea(){
  const text=document.getElementById('idea-text')?.value?.trim();
  if(!text){showToast('Write your idea first','error');return;}
  showToast('✅ Idea submitted! Owner will review it.','success');
  closeModal();
}
function openMultiSiteModal(){
  const siteOpts=SITES.filter(s=>s.status==='active').map(s=>`<option>${s.name}</option>`).join('');
  openModal('Add Multi-Site Assignment',`
  <div class="eod-form">
    <div class="row2">
      <div class="form-row"><label>Employee</label><input id="ms-emp" placeholder="Employee name"/></div>
      <div class="form-row"><label>From Date</label><input type="date" id="ms-from" value="${new Date().toISOString().split('T')[0]}"/></div>
    </div>
    <div class="row2">
      <div class="form-row"><label>Site 1</label><select id="ms-site1">${siteOpts}</select></div>
      <div class="form-row"><label>Site 2</label><select id="ms-site2">${siteOpts}</select></div>
    </div>
    <div class="btn-row"><button class="btn-primary" onclick="saveMultiSite()">💾 Save Assignment</button></div>
  </div>`);
}
function saveMultiSite(){
  const emp=document.getElementById('ms-emp')?.value?.trim();
  if(!emp){showToast('Enter employee name','error');return;}
  showToast('✅ Multi-site assignment saved','success');
  closeModal();
}
function addMIRRow(){
  const tbody=document.getElementById('mir-tbody');
  if(!tbody)return;
  const n=tbody.querySelectorAll('tr').length+1;
  tbody.insertAdjacentHTML('beforeend',`<tr>
    <td>${n}</td>
    <td><input style="width:100%;border:none;background:transparent"/></td>
    <td><input style="width:60px;border:none;background:transparent" placeholder="Rft"/></td>
    <td><input type="number" style="width:60px;border:none;background:transparent"/></td>
    <td><input type="number" style="width:70px;border:none;background:transparent"/></td>
    <td style="color:var(--blue)">₹0</td>
    <td><button onclick="this.closest('tr').remove()" style="border:none;background:none;color:var(--red);cursor:pointer">✕</button></td>
  </tr>`);
}
function openQuickDelegate(userKey){
  const u=USERS[userKey];
  if(!u){return;}
  openModal('Quick Delegate to '+u.name,`
  <div class="eod-form">
    <div class="form-row"><label>Task</label><textarea id="qd-task" rows="3" placeholder="Describe the task..."></textarea></div>
    <div class="form-row"><label>Priority</label>
      <select id="qd-pri"><option value="high">🔴 High</option><option value="med" selected>🟡 Medium</option><option value="low">🟢 Low</option></select>
    </div>
    <div class="form-row"><label>Due Date</label><input type="date" id="qd-due" value="${new Date(Date.now()+86400000).toISOString().split('T')[0]}"/></div>
    <div class="btn-row"><button class="btn-primary" onclick="submitQuickDelegate('${userKey}')">📤 Assign Task</button></div>
  </div>`);
}
async function submitQuickDelegate(userKey){
  const task=document.getElementById('qd-task')?.value?.trim();
  const pri=document.getElementById('qd-pri')?.value||'med';
  const due=document.getElementById('qd-due')?.value||new Date().toISOString().split('T')[0];
  if(!task){showToast('Enter task description','error');return;}
  const newTask={id:'dt'+Date.now(),from:'prayas',to:userKey,task,priority:pri,date:due,done:false};
  DELEGATED_TASKS.unshift(newTask);
  if(window.fbSaveDelegatedTask){const ok=await window.fbSaveDelegatedTask(newTask);if(ok){showToast('✅ Task assigned to '+USERS[userKey]?.name+' & saved to cloud','success');}else{showToast('✅ Task assigned (local)','success');}}
  else{showToast('✅ Task assigned to '+USERS[userKey]?.name,'success');}
  closeModal();
}
// Init
document.addEventListener('DOMContentLoaded',()=>{
  updateBadges();
  setInterval(updateBadges,30000);
});
</script>
